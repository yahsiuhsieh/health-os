name: HealthOS

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Operation"
        required: true
        default: "daily"
        type: choice
        options:
          - daily
          - weekly
      force_email:
        description: "Force daily email even if it was already sent"
        required: false
        default: false
        type: boolean
  schedule:
    # GitHub cron is UTC: 09:00 Chicago daylight time, 08:00 standard time.
    - cron: "0 14 * * *"
    - cron: "0 11 * * 0"

jobs:
  daily-email:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 14 * * *') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.operation == 'daily')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      AI_PROVIDER: ${{ vars.AI_PROVIDER || 'openrouter' }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'openrouter/free' }}
      HEALTHOS_TIMEZONE: ${{ vars.HEALTHOS_TIMEZONE || 'America/Chicago' }}
      GMAIL_FROM_EMAIL: ${{ secrets.GMAIL_FROM_EMAIL }}
      SUMMARY_RECIPIENT_EMAIL: ${{ secrets.SUMMARY_RECIPIENT_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run HealthOS morning email
        env:
          FORCE_EMAIL: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force_email == 'true' }}
        run: |
          if [[ "$FORCE_EMAIL" == "true" ]]; then
            PYTHONPATH=src python -m healthos run --force
          else
            PYTHONPATH=src python -m healthos run
          fi

  weekly-reconciliation:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 11 * * 0') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.operation == 'weekly')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      HEALTHOS_TIMEZONE: ${{ vars.HEALTHOS_TIMEZONE || 'America/Chicago' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run HealthOS weekly reconciliation
        run: |
          PYTHONPATH=src python -m healthos sync --days 30
          PYTHONPATH=src python -m healthos cleanup --raw-days 30
